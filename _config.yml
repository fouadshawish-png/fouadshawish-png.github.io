title: "محترف المصاريف"
description: "مقالات ونصائح مالية عن إدارة المصاريف وتتبع الدخل وتحسين السلوك المالي."
url: "https://fouadshawish-png.github.io"
baseurl: ""

author:
  name: "فؤاد شاويش"
  email: "fouad.shawish@gmail.com"

logo: "/icon.png"
locale: "ar_AR"
timezone: "Asia/Gaza"

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-last-modified-at

include:
  - .well-known

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - category/
  - topics/
  - blog/
  - share/
  - ping/
  - sitemap.html

sitemap:
  priority: 0.8

last_modified_at: true

featured_posts:
  - /organize-monthly-expenses-step-by-step/
  - /ultimate-guide-personal-finance-arabic/
  - /weekly-budget-review-system/
  - /build-realistic-monthly-budget/
  - /manage-personal-debt-step-by-step/
  - /how-to-track-expenses-daily-effectively/

defaults:
  - scope:
      path: ""
    values:
      sitemap: false
  - scope:
      path: "_posts"
      type: "posts"
    values:
      sitemap: true
      sitemap_priority: 0.7
  - scope:
      path: "all_transactions.html"
    values:
      sitemap: false
      robots: "noindex,follow"
  - scope:
      path: "reports_root.html"
    values:
      sitemap: false
      robots: "noindex,follow"
  - scope:
      path: "debt_root.html"
    values:
      sitemap: false
      robots: "noindex,follow"
  - scope:
      path: "goals_root.html"
    values:
      sitemap: false
      robots: "noindex,follow"
  - scope:
      path: "subscription_plans.html"
    values:
      sitemap: false
      robots: "noindex,follow"
  - scope:
      path: "reports_root/index.html"
    values:
      sitemap: false
      robots: "noindex,follow"
  - scope:
      path: "404.html"
    values:
      sitemap: false
      robots: "noindex,follow"
  - scope:
      path: "google04ed8dc5b604f682.html"
    values:
      sitemap: false
      robots: "noindex,follow"
  - scope:
      path: "manifest.webmanifest"
    values:
      sitemap: false
      robots: "noindex,follow"
  - scope:
