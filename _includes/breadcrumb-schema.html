{% if page.layout == "post" %}
{%- if page.canonical -%}
{%- assign breadcrumb_post_url = page.canonical -%}
{%- else -%}
{%- assign breadcrumb_post_url = page.url | absolute_url -%}
{%- endif -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "الرئيسية",
      "item": "{{ site.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "المدونة",
      "item": "{{ site.url }}/blog/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ page.title | escape }}",
      "item": "{{ breadcrumb_post_url }}"
    }
  ]
}
</script>
{% endif %}
