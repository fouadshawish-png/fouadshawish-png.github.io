<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
{% if page.title %}
{{ page.title }} | {{ site.title }}
{% else %}
{{ site.title }} – تطبيق عربي لإدارة المصاريف والميزانية
{% endif %}
</title>

<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

<link rel="canonical" href="{{ page.url | absolute_url }}">

{% assign default_og_image = site.url | append: '/assets/images/og-default.jpg' %}
{% assign post_og_image = page.image | absolute_url %}
{% if page.layout == "post" %}
<!-- Open Graph: Article -->
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{% if page.image %}{{ post_og_image }}{% else %}{{ default_og_image }}{% endif %}">
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
<meta property="article:author" content="{{ site.author.name | default: 'فؤاد شاويش' }}">

<!-- Twitter Card: Article -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description }}">
<meta name="twitter:image" content="{% if page.image %}{{ post_og_image }}{% else %}{{ default_og_image }}{% endif %}">
{% else %}
<!-- Open Graph: Website -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="{{ site.url }}">
<meta property="og:image" content="{{ default_og_image }}">

<!-- Twitter Card: Website -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ site.title }}">
<meta name="twitter:description" content="{{ site.description }}">
<meta name="twitter:image" content="{{ default_og_image }}">
{% endif %}

<!-- Theme Color -->
<meta name="theme-color" content="#006A4E">

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{ '/icon.png' | relative_url }}">

<!-- Manifest -->
<link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
<link rel="alternate" type="application/rss+xml" title="RSS" href="{{ '/feed.xml' | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;700&display=swap">
</noscript>

<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

{% include structured-data.html %}
