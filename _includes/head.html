<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
{% if page.title %}
{{ page.title }} | {{ site.title }}
{% else %}
{{ site.title }} – تطبيق عربي لإدارة المصاريف والميزانية
{% endif %}
</title>

<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/icon.png' | absolute_url }}">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ '/icon.png' | absolute_url }}">

<!-- Theme Color -->
<meta name="theme-color" content="#006A4E">

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{ '/icon.png' | relative_url }}">

<!-- Manifest -->
<link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">

<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

{% include structured-data.html %}
