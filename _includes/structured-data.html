{%- assign org_name = site.author.name | default: site.title -%}
{%- assign site_url = '/' | absolute_url -%}
{%- assign logo_abs = site.logo | default: '/icon.png' | absolute_url -%}
{%- assign og_abs = site.default_og_image | default: site.logo | default: '/icon.png' | absolute_url -%}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ site_url }}#website",
      "url": "{{ site_url }}",
      "name": "{{ site.title | escape }}",
      "description": "{{ site.description | strip_newlines | escape }}",
      "inLanguage": "{{ site.lang | default: 'ar' | escape }}",
      "publisher": {
        "@id": "{{ site_url }}#organization"
      }
    },
    {
      "@type": "Organization",
      "@id": "{{ site_url }}#organization",
      "name": "{{ org_name | escape }}",
      "url": "{{ site_url }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ logo_abs }}"
      }
    }
    {%- if site.app and site.app.play_store_url -%}
    ,{
      "@type": "SoftwareApplication",
      "name": "{{ site.app.name | default: site.title | escape }}",
      "operatingSystem": "{{ site.app.platform | default: 'Android' | escape }}",
      "applicationCategory": "{{ site.app.category | default: 'FinanceApplication' | escape }}",
      "description": "{{ site.description | strip_newlines | escape }}",
      "image": "{{ logo_abs }}",
      "url": "{{ site_url }}",
      "installUrl": "{{ site.app.play_store_url | escape }}",
      "offers": {
        "@type": "Offer",
        "url": "{{ site.app.play_store_url | escape }}"
      }
    }
    {%- endif -%}
  ]
}
</script>
