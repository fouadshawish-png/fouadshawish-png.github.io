<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var useDark = savedTheme ? savedTheme === "dark" : prefersDark;
          if (useDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
    {% include head.html %}
    {% include app-schema.html %}
  </head>

  <body>
    {% include app-banner.html %}
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
    <a href="/?route=home" class="floating-app-btn">
      فتح التطبيق
    </a>
    <script>
      (function() {
        var toggle = document.getElementById("themeToggle");
        if (!toggle) return;

        function applyToggleState() {
          var isDark = document.documentElement.classList.contains("dark");
          toggle.textContent = isDark ? "☀️" : "🌙";
          toggle.setAttribute("aria-pressed", String(isDark));
        }

        applyToggleState();

        toggle.addEventListener("click", function() {
          document.documentElement.classList.toggle("dark");
          try {
            localStorage.setItem("theme", document.documentElement.classList.contains("dark") ? "dark" : "light");
          } catch (e) {}
          applyToggleState();
        });
      })();
    </script>
    <script>
      (function() {
        window.dataLayer = window.dataLayer || [];
        if (typeof window.gtag !== "function") {
          window.gtag = function(){ window.dataLayer.push(arguments); };
        }
      })();
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        let scroll50Sent = false;
        let scroll90Sent = false;

        window.addEventListener("scroll", function () {
          const scrollPercent = (window.scrollY + window.innerHeight) / document.body.scrollHeight * 100;

          if (scrollPercent > 50 && !scroll50Sent) {
            gtag('event', 'scroll_50', { event_category: 'engagement' });
            scroll50Sent = true;
          }

          if (scrollPercent > 90 && !scroll90Sent) {
            gtag('event', 'scroll_90', { event_category: 'engagement' });
            scroll90Sent = true;
          }
        }, { passive: true });

        var startBtn = document.querySelector(".cta-start");
        if (startBtn) {
          startBtn.addEventListener("click", function () {
            gtag('event', 'click_cta_home', { event_category: 'engagement' });
          });
        }

        var playBtn = document.querySelector(".play-store-btn");
        if (playBtn) {
          playBtn.addEventListener("click", function () {
            gtag('event', 'click_google_play', { event_category: 'conversion' });
          });
        }
      });
    </script>
  </body>
</html>
