---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  {{ content }}
  <div class="share-actions" aria-label="مشاركة المقال">
    <a class="share-button share-facebook" target="_blank" rel="noopener noreferrer"
       href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ site.baseurl }}{{ page.url | url_encode }}">
      مشاركة على فيسبوك
    </a>
  </div>
</article>
