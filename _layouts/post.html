---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  {{ content }}
  <div class="share-actions" aria-label="مشاركة المقال">
     <a class="share-button share-facebook" target="_blank" rel="noopener noreferrer"
       href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}">
      مشاركة على فيسبوك
    </a>
  </div>
</article>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ page.title | escape }}",
  "description": "{{ page.description | default: site.description | strip_newlines | escape }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": "{{ site.author.name | escape }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "{{ site.title | escape }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.logo | default: '/icon.png' | absolute_url }}"
    }
  },
  "image": "{{ page.image | default: site.default_og_image | default: site.logo | default: '/icon.png' | absolute_url }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  }
}
</script>
