---
layout: default
title: "المقالات"
description: "مقالات ونصائح مالية حول إدارة المصاريف والميزانية."
---

<h1 class="page-title">المدونة</h1>

<ul>
  {% for post in site.posts %}
  <li style="margin-bottom:15px;">
    <a href="{{ post.url }}" style="font-size:20px; color:#ff7c00; text-decoration:none;">
      {{ post.title }}
    </a>
    <br>
    <span style="color:#777;">{{ post.date | date: "%Y-%m-%d" }}</span>
  </li>
  {% endfor %}
</ul>
