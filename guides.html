---
layout: default
title: الأدلة المالية
---

<section class="section">
  <h1>الأدلة المالية</h1>

  <div class="grid-3">
    {% for guide in site.guides %}
      <div class="card">
        <h3>{{ guide.title }}</h3>
        <p>{{ guide.description }}</p>
        <a class="btn-accent" href="{{ guide.url }}">
          اقرأ الدليل
        </a>
      </div>
    {% endfor %}
  </div>
</section>
